name: Build APK

on:
  push:
    branches: [ main ]
    paths:
      - 'jessica_full.html'
      - 'android-project/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.4
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.4'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Copy HTML to assets
      run: cp jessica_full.html android-project/app/src/main/assets/index.html

    - name: Build APK
      run: |
        cd android-project
        gradle assembleDebug --no-daemon

    - name: Get version
      id: version
      run: |
        VERSION=$(grep 'versionName' android-project/app/build.gradle | sed 's/.*"\(.*\)".*/\1/')
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: 杰西卡v${{ steps.version.outputs.version }}
        path: android-project/app/build/outputs/apk/debug/app-debug.apk

    - name: Create Release
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: 杰西卡 v${{ steps.version.outputs.version }}
        files: android-project/app/build/outputs/apk/debug/app-debug.apk
        body: |
          自动编译 ${{ github.event.head_commit.message }}
          编译时间: ${{ github.event.head_commit.timestamp }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
