name: Bug 反馈
description: 发现了一个问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量详细描述问题。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么？期望的行为是什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 怎么触发这个问题？
      placeholder: |
        1. 打开 APP
        2. 点击 xxx
        3. 看到 xxx
  - type: input
    id: version
    attributes:
      label: APP 版本
      placeholder: "v3.3.1"
  - type: input
    id: device
    attributes:
      label: 手机型号 / 系统
      placeholder: "Redmi K60 / Android 15"
