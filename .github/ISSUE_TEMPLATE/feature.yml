name: 功能建议
description: 想要一个新功能
labels: ["enhancement"]
body:
  - type: textarea
    id: feature
    attributes:
      label: 想要什么功能
      description: 描述你想要的功能
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 为什么需要
      description: 这个功能解决什么问题？
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、参考、其他想法
