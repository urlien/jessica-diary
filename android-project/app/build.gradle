plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jessica.diary'
    compileSdk 34

    defaultConfig {
        applicationId "com.jessica.diary"
        minSdk 24
        targetSdk 34
        versionCode 36
        versionName "酷暑"
    }

    // 固定签名：CI 从环境变量读 keystore，本地未设置则回退默认
    def ksPath = System.getenv("JESSICA_KEYSTORE_PATH")
    def ksPass = System.getenv("JESSICA_KEYSTORE_PASSWORD")

    signingConfigs {
        if (ksPath != null && ksPass != null && file(ksPath).exists()) {
            jessica {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias "jessica"
                keyPassword System.getenv("JESSICA_KEY_PASSWORD") ?: ksPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksPath != null && ksPass != null && file(ksPath).exists()) {
                signingConfig signingConfigs.jessica
            }
        }
        debug {
            minifyEnabled false
            if (ksPath != null && ksPass != null && file(ksPath).exists()) {
                signingConfig signingConfigs.jessica
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
}
